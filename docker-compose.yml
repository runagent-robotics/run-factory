services:
  backend:
    build:
      context: ./runfactory-core
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

  dashboard:
    build:
      context: ./runfactory-dashboard
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:4173:4173"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: runfactory
      POSTGRES_USER: runfactory
      POSTGRES_PASSWORD: runfactory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runfactory -d runfactory"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  nats:
    image: nats:2.11-alpine
    command: ["-js"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

volumes:
  postgres-data:
